<fieldset hlmFieldSet>
    <div hlmFieldGroup>
        <div hlmField>
            <label hlmFieldLabel for="username">Username</label>
            <input hlmInput id="username" type="text" placeholder="Your name" />
            <p hlmFieldDescription>Choose a unique username for your account.</p>
        </div>
        <div hlmField>
            <label hlmFieldLabel for="password">Password</label>
            <input hlmInput id="password" type="password" placeholder="••••••••" />
            <p hlmFieldDescription>Must be at least 8 characters long.</p>
            <p hlmFieldDescription>Must have 1 special character.</p>
            <p hlmFieldDescription>Must have 1 uppercase letter.</p>
            <p hlmFieldDescription>Must have 1 number.</p>
        </div>
    </div>
</fieldset>
